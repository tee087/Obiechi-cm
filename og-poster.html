<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MTN MoMo Cameroon – Easy Loans | OG Poster</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            margin: 0;
            width: 1200px;
            height: 630px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #003366 0%, #004080 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
        }
        .poster {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #003366 0%, #004080 60%, #005c99 100%);
            position: relative;
            overflow: hidden;
            padding: 60px 80px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.4);
        }
        .poster::before {
            content: '';
            position: absolute;
            top: -50px;
            right: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, transparent 70%);
            border-radius: 50%;
        }
        .poster::after {
            content: '';
            position: absolute;
            bottom: -60px;
            left: -60px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
            border-radius: 50%;
        }
        .cameroon-stripes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #006B3F 33%, #CE1126 33% 66%, #FCD116 66%);
            opacity: 0.9;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
        }
        .logo-img {
            width: 56px;
            height: 56px;
            background: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }
        .brand {
            display: flex;
            flex-direction: column;
        }
        .brand .momo {
            color: #FFD700;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }
        .brand .cameroon {
            font-size: 12px;
            color: rgba(255,255,255,0.7);
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        h1 {
            font-size: 42px;
            font-weight: 800;
            line-height: 1.15;
            margin: 30px 0 16px;
            color: #fff;
        }
        h1 .accent {
            color: #FFD700;
        }
        p.tagline {
            font-size: 18px;
            color: rgba(255,255,255,0.85);
            margin-bottom: 40px;
            max-width: 700px;
            line-height: 1.5;
        }
        .details {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 24px;
            margin-bottom: 40px;
        }
        .detail-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .detail-card .label {
            font-size: 12px;
            font-weight: 700;
            color: #FFD700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }
        .detail-card .value {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
        }
        .cta {
            background: #FFD700;
            color: #003366;
            border: none;
            border-radius: 10px;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 800;
            letter-spacing: 0.5px;
            cursor: pointer;
            width: fit-content;
            box-shadow: 0 8px 24px rgba(255,215,0,0.35);
            transition: transform 0.2s;
        }
        .cta:hover {
            transform: translateY(-2px);
        }
        .footer {
            position: absolute;
            bottom: 40px;
            left: 80px;
            right: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: rgba(255,255,255,0.5);
            border-top: 1px solid rgba(255,255,255,0.15);
            padding-top: 16px;
        }
        .footer .support {
            font-weight: 600;
            color: rgba(255,255,255,0.7);
        }
        .star {
            position: absolute;
            top: 110px;
            left: 90px;
            font-size: 32px;
            color: #000;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="poster">
        <div class="cameroon-stripes"></div>
        <div class="star">★</div>
        <div class="logo">
            <div class="logo-img">🟡</div>
            <div class="brand">
                <div class="momo">MoMo</div>
                <div class="cameroon">from MTN Cameroon</div>
            </div>
        </div>
        <h1>Easy Loans via <span class="accent">MTN MoMo Cameroon</span></h1>
        <p class="tagline">Get instant loans straight to your MTN MoMo wallet. No collateral. No paperwork. Approved in minutes.</p>
        <div class="details">
            <div class="detail-card">
                <div class="label">Loan Amount</div>
                <div class="value">XAF 500 – XAF 5,000</div>
            </div>
            <div class="detail-card">
                <div class="label">Term</div>
                <div class="value">Up to 60 Months</div>
            </div>
            <div class="detail-card">
                <div class="label">Disbursement</div>
                <div class="value">Within 5 Minutes</div>
            </div>
        </div>
        <button class="cta">Apply Now – *126#</button>
        <div class="footer">
            <span>MTN Cameroon</span>
            <span class="support">Support: 100</span>
            <span>momo.mtn.com/home-cm</span>
        </div>
    </div>
</body>
</html>
